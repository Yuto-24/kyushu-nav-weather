name: verify
on:
  push:
    branches: [main]
    paths:
      - production/**
      - analysis/pseudo_sectors/**
      - analysis/geographic_revision/build_geographic_sheet.py
      - services/weather-trigger/**
      - .github/workflows/**
  pull_request:
    paths:
      - production/**
      - analysis/pseudo_sectors/**
      - analysis/geographic_revision/build_geographic_sheet.py
      - services/weather-trigger/**
      - .github/workflows/**
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            production/requirements-weather.txt
            production/requirements-renderer.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r production/requirements-weather.txt -r production/requirements-renderer.txt
      - name: Check acquisition, date identity and coherent static publication
        run: |
          python -m unittest discover -s production -p test_weather_pipeline.py -v
          python -m unittest -v production.test_actions_job production.test_pages_publication
      - name: Check supplemental scheduling and dispatch boundaries
        run: node --test services/weather-trigger/worker.test.mjs
      - name: Check browser script syntax
        run: node --check production/web/app.js
